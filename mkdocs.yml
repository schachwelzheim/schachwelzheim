site_name: Schach in Welzheim
site_url: https://schachwelzheim.github.io/schachwelzheim/
site_description: Schachaktivitäten in Welzheim, im Verein, in Schulen, ...
site_author: Schach in Welzheim

# Design & Theme
theme:
  name: material
  # Falls ein Logo oder Titel gesetzt ist:
  features:
    - navigation.instant
  language: de
  logo: assets/images/logo.png  # Pfad zu deinem runden Logo
  favicon: assets/images/logo.png # Optional: Das kleine Icon im Browser-Tab
  palette:
    # Automatische Erkennung von hellem/dunklem Modus (oder festes Schema)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom # Aktiviert die eigene Farbe
      accent: green
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: green

# Eigenes CSS, um exakt deinen HEX-Farbcode #106933 als Hauptfarbe zu hinterlegen
extra_css:
  - stylesheets/extra.css

# Plugins (z.B. für Suche)
plugins:
  - search
  
markdown_extensions:
  - attr_list
  
# Die Navigationsstruktur (Menu) – spiegelt deine Ordnerstruktur wider
nav:
  - Startseite: index.md
  - Aktuelles:
      - Übersicht: aktuelles/index.md
      - Sieg und Niederlage zum Saisonstart: aktuelles/2026-10-02-sieg-und-niederlage.md
  - Verein:
      - Mannschaften: verein/mannschaften.md
      - Training: verein/training.md
  - Jugend & AGs:
      - Schulschach-AG: jugend-und-ags/schulschach-ag.md
      - Jugendtraining: jugend-und-ags/jugendtraining.md
  - Spiellokal: orte/spiellokal.md
