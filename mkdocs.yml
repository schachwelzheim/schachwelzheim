site_name: Schach in Welzheim
site_url: https://schachwelzheim.github.io/schachwelzheim/
site_description: Schachaktivitäten in Welzheim, im Verein, in Schulen, ...
site_author: Schach in Welzheim

# Design & Theme
theme:
  name: material
  features:
    - navigation.instant
  language: de
  logo: assets/images/logo.png
  favicon: assets/images/logo.png

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: green

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: green

# Eigenes CSS
extra_css:
  - stylesheets/extra.css

# Plugins
plugins:
  - search
  - tags:
      tags_file: aktuelles/aktuelles-tags.md

# Markdown
markdown_extensions:
  - attr_list

# Navigation
nav:
  - Startseite: index.md

  - Aktuelles:
      - Übersicht: aktuelles/index.md
      - Nach Themen: aktuelles/aktuelles-tags.md

  - Verein:
      - Mannschaften: verein/mannschaften.md
      - Training: verein/training.md

  - Jugend & AGs:
      - Schulschach-AG: jugend-und-ags/schulschach-ag.md
      - Jugendtraining: jugend-und-ags/jugendtraining.md

  - Spiellokal: orte/spiellokal.md
