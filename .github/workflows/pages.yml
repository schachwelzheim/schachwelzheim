name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main  # Oder 'master', je nachdem wie dein Haupt-Branch heißt

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install mkdocs-material pyyaml

      - name: Auto-generate navigation & Build
        run: |
          python -c '
          import os
          import yaml
          import re

          docs_dir = "docs"
          nav = []

          # Funktion zum Auslesen der ersten Markdown-Überschrift (# Titel)
          def get_markdown_title(file_path, default_title):
              try:
                  with open(file_path, "r", encoding="utf-8") as f:
                      for line in f:
                          match = re.match(r"^#\s+(.+)", line.strip())
                          if match:
                              return match.group(1)
              except Exception:
                  pass
              return default_title

          def scan_folder(path):
              items = []
              # Neueste Dateien (z.B. nach Datum benannt) zuerst sortieren
              entries = sorted(os.listdir(path), reverse=True)
              
              for entry in entries:
                  full_path = os.path.join(path, entry)
                  rel_path = os.path.relpath(full_path, docs_dir)
                  
                  if os.path.isdir(full_path):
                      sub_items = scan_folder(full_path)
                      if sub_items:
                          folder_title = entry.replace("_", " ").capitalize()
                          items.append({folder_title: sub_items})
                  elif entry.endswith(".md"):
                      if entry == "index.md" and path == docs_dir:
                          continue
                      
                      name_without_ext = os.path.splitext(entry)[0]
                      default_title = name_without_ext.replace("-", " ").capitalize()
                      
                      # Titel aus der ersten Überschrift der Markdown-Datei holen
                      title = get_markdown_title(full_path, default_title)
                      
                      items.append({title: rel_path.replace(os.sep, "/")})
              return items

          if os.path.exists(os.path.join(docs_dir, "index.md")):
              nav.append({"Startseite": "index.md"})

          nav.extend(scan_folder(docs_dir))

          with open("mkdocs.yml", "r", encoding="utf-8") as f:
              config = yaml.safe_load(f)

          config["nav"] = nav

          with open("mkdocs.yml", "w", encoding="utf-8") as f:
            yaml.dump(config, f, allow_unicode=True, sort_keys=False)

          print("Navigation erfolgreich und mit echten Überschriften generiert!")
          '

      - name: Build and deploy
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force
          
