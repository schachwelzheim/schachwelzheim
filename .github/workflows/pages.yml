name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install mkdocs-material pyyaml

      - name: Auto-generate navigation, News-Index & Build
        run: |
          python3 - << 'EOF'
          import os
          import yaml
          import re

          docs_dir = "docs"
          aktuelles_dir = os.path.join(docs_dir, "aktuelles")
          nav = []

          def parse_markdown_file(file_path):
              title = ""
              teaser_words = []

              try:
                  with open(file_path, "r", encoding="utf-8") as f:
                      for line in f:
                          clean_line = line.strip()

                          # Markdown-H1 erkennen:
                          # # Überschrift
                          if not title and clean_line.startswith("# "):
                              title = clean_line[2:].strip()
                              continue

                          # HTML-H1 erkennen:
                          # <H1>Willkommen bei<br>Schach in Welzheim</H1>
                          if not title:
                              h1_match = re.search(
                                  r"<h1[^>]*>(.*?)</h1>",
                                  clean_line,
                                  re.IGNORECASE
                              )

                              if h1_match:
                                  title = h1_match.group(1)

                                  # <br>, <br/> oder <br /> durch Leerzeichen ersetzen
                                  title = re.sub(
                                      r"<br\s*/?>",
                                      " ",
                                      title,
                                      flags=re.IGNORECASE
                                  )

                                  # Eventuell vorhandene weitere HTML-Tags entfernen
                                  title = re.sub(
                                      r"<[^>]+>",
                                      "",
                                      title
                                  ).strip()

                                  continue

                          # Teasertext ermitteln
                          if title and clean_line and not clean_line.startswith("#"):
                              if re.match(r"^\d+\.", clean_line):
                                  continue

                              words = re.findall(r"\b\w+\b", clean_line)
                              teaser_words.extend(words)

                              if len(teaser_words) >= 10:
                                  break

              except Exception:
                  pass

              teaser = (
                  " ".join(teaser_words[:10]) + "..."
                  if teaser_words
                  else "Keine Vorschau verfügbar..."
              )

              return title, teaser


          # ============================================================
          # AKTUELLES
          # ============================================================

          news_items = []

          if os.path.exists(aktuelles_dir):

              md_files = sorted(
                  [
                      f
                      for f in os.listdir(aktuelles_dir)
                      if f.endswith(".md") and f != "index.md"
                  ],
                  reverse=True
              )

              for filename in md_files:

                  file_path = os.path.join(aktuelles_dir, filename)
                  base_name = os.path.splitext(filename)[0]
                  default_title = base_name

                  title, teaser = parse_markdown_file(file_path)

                  if not title:
                      title = default_title.replace("-", " ").capitalize()

                  # Datum aus Dateiname erkennen
                  date_match = re.match(
                      r"(\d{4})-(\d{2})-(\d{2})",
                      base_name
                  )

                  if date_match:
                      year, month, day = date_match.groups()
                      formatted_date = f"{day}.{month}.{year}"
                  else:
                      formatted_date = ""

                  # Bilderordner des Beitrags
                  img_folder = os.path.join(
                      aktuelles_dir,
                      base_name
                  )

                  images = []

                  if os.path.exists(img_folder) and os.path.isdir(img_folder):

                      valid_exts = (
                          ".png",
                          ".jpg",
                          ".jpeg",
                          ".gif",
                          ".webp"
                      )

                      images = sorted(
                          [
                              img
                              for img in os.listdir(img_folder)
                              if img.lower().endswith(valid_exts)
                          ]
                      )

                  news_items.append({
                      "filename": filename,
                      "base_name": base_name,
                      "title": title,
                      "teaser": teaser,
                      "date": formatted_date,
                      "images": images
                  })


              # ========================================================
              # GALERIEN IN BEITRÄGEN AKTUALISIEREN
              # ========================================================

              for item in news_items:

                  file_path = os.path.join(
                      aktuelles_dir,
                      item["filename"]
                  )

                  with open(file_path, "r", encoding="utf-8") as f:
                      content = f.read()

                  # Vorhandene automatisch erzeugte Galerie entfernen
                  if "\n\n## Bilder zum Beitrag\n" in content:
                      content = content.split(
                          "\n\n## Bilder zum Beitrag\n"
                      )[0]

                  # Galerie neu erzeugen
                  if item["images"]:

                      content += "\n\n## Bilder zum Beitrag\n\n"
                      content += '<div class="gallery" markdown>\n\n'

                      for img in item["images"]:

                          content += (
                              f'<a class="glightbox" href="{img}">'
                              f'<img src="{img}" width="300" '
                              f'style="border-radius: 8px; margin: 8px;" />'
                              f'</a>\n'
                          )

                      content += "\n</div>\n"

                  with open(file_path, "w", encoding="utf-8") as f:
                      f.write(content)


              # ========================================================
              # AKTUELLES INDEX AKTUALISIEREN
              # ========================================================

              index_path = os.path.join(
                  aktuelles_dir,
                  "index.md"
              )

              existing_index_content = ""

              if os.path.exists(index_path):

                  with open(index_path, "r", encoding="utf-8") as f:
                      existing_index_content = f.read()

                  # Automatisch erzeugten Bereich entfernen
                  if "\n\n## Beiträge\n" in existing_index_content:
                      existing_index_content = existing_index_content.split(
                          "\n\n## Beiträge\n"
                      )[0]


              if existing_index_content.strip():

                  index_content = existing_index_content.strip()

              else:

                  index_content = (
                      "# Aktuelles aus der Schachabteilung\n\n"
                      "Hier findest du alle Neuigkeiten."
                  )


              index_content += "\n\n## Beiträge\n\n"


              for item in news_items:

                  d_str = (
                      f"**[{item['date']}]** "
                      if item["date"]
                      else ""
                  )

                  index_content += (
                      f"* {d_str}"
                      f"**[{item['title']}]({item['filename']})**"
                      f" – {item['teaser']} "
                      f"[weiterlesen]({item['filename']})\n"
                  )


              with open(index_path, "w", encoding="utf-8") as f:
                  f.write(index_content)


          # ============================================================
          # ORDNER UND MARKDOWN-DATEIEN DURCHSUCHEN
          # ============================================================

          def scan_folder(path):

              items = []

              entries = sorted(
                  os.listdir(path),
                  reverse=True
              )

              for entry in entries:

                  full_path = os.path.join(path, entry)
                  rel_path = os.path.relpath(
                      full_path,
                      docs_dir
                  )

                  # ----------------------------------------------------
                  # Unterordner
                  # ----------------------------------------------------

                  if os.path.isdir(full_path):

                      # News-Beitragsordner überspringen
                      if any(
                          item["base_name"] == entry
                          for item in news_items
                      ):
                          continue

                      sub_items = scan_folder(full_path)

                      if sub_items:

                          sub_index = os.path.join(
                              full_path,
                              "index.md"
                          )

                          folder_title = ""

                          if os.path.exists(sub_index):

                              folder_title, _ = parse_markdown_file(
                                  sub_index
                              )

                          if not folder_title:

                              folder_title = (
                                  entry
                                  .replace("_", " ")
                                  .replace("-", " ")
                                  .capitalize()
                              )

                          # Übersicht als erster Menüpunkt
                          sub_index_rel = os.path.relpath(
                              sub_index,
                              docs_dir
                          ).replace(os.sep, "/")

                          sub_nav_list = (
                              [{"Übersicht": sub_index_rel}]
                              +
                              [
                                  item
                                  for item in sub_items
                                  if list(item.values())[0] != sub_index_rel
                              ]
                          )

                          items.append({
                              folder_title: sub_nav_list
                          })


                  # ----------------------------------------------------
                  # Markdown-Dateien
                  # ----------------------------------------------------

                  elif entry.endswith(".md"):

                      # index.md wird vom übergeordneten Ordner behandelt
                      if entry == "index.md":
                          continue

                      name_without_ext = os.path.splitext(entry)[0]

                      default_title = (
                          name_without_ext
                          .replace("-", " ")
                          .capitalize()
                      )

                      title, _ = parse_markdown_file(full_path)

                      if not title:
                          title = default_title

                      items.append({
                          title: rel_path.replace(os.sep, "/")
                      })

              return items


          # ============================================================
          # STARTSEITE
          # ============================================================

          start_index = os.path.join(
              docs_dir,
              "index.md"
          )

          if os.path.exists(start_index):

              start_title, _ = parse_markdown_file(
                  start_index
              )

              if not start_title:
                  start_title = "Startseite"

              nav.append({
                  start_title: "index.md"
              })


          # ============================================================
          # AKTUELLES ALS HAUPTMENÜPUNKT
          # ============================================================

          aktuelles_items = scan_folder(
              aktuelles_dir
          )

          if aktuelles_items:

              akt_index = os.path.join(
                  aktuelles_dir,
                  "index.md"
              )

              akt_title, _ = parse_markdown_file(
                  akt_index
              )

              if not akt_title:
                  akt_title = "Aktuelles"

              aktuelles_nav_list = (
                  [{"Übersicht": "aktuelles/index.md"}]
                  +
                  [
                      item
                      for item in aktuelles_items
                      if list(item.values())[0] != "aktuelles/index.md"
                  ]
              )

              nav.append({
                  akt_title: aktuelles_nav_list
              })


          # ============================================================
          # ALLE ANDEREN ORDNER
          # ============================================================

          for entry in sorted(
              os.listdir(docs_dir)
          ):

              full_path = os.path.join(
                  docs_dir,
                  entry
              )

              if (
                  os.path.isdir(full_path)
                  and entry != "aktuelles"
              ):

                  sub_items = scan_folder(
                      full_path
                  )

                  if sub_items:

                      sub_index = os.path.join(
                          full_path,
                          "index.md"
                      )

                      folder_title = ""

                      sub_index_rel = (
                          f"{entry}/index.md"
                      )

                      if os.path.exists(sub_index):

                          folder_title, _ = parse_markdown_file(
                              sub_index
                          )

                      if not folder_title:

                          folder_title = (
                              entry
                              .replace("_", " ")
                              .replace("-", " ")
                              .capitalize()
                          )

                      folder_nav_list = (
                          [{"Übersicht": sub_index_rel}]
                          +
                          [
                              item
                              for item in sub_items
                              if list(item.values())[0] != sub_index_rel
                          ]
                      )

                      nav.append({
                          folder_title: folder_nav_list
                      })


          # ============================================================
          # MKDOCS.YML AKTUALISIEREN
          # ============================================================

          with open(
              "mkdocs.yml",
              "r",
              encoding="utf-8"
          ) as f:

              config = yaml.safe_load(f)


          config["nav"] = nav


          with open(
              "mkdocs.yml",
              "w",
              encoding="utf-8"
          ) as f:

              yaml.dump(
                  config,
                  f,
                  allow_unicode=True,
                  sort_keys=False
              )

          EOF

      - name: Build and deploy
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force
