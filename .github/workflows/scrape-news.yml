name: TSF Welzheim Schach News Scraper

on:
  workflow_dispatch: # Ermöglicht den manuellen Start über GitHub
  # schedule:
  #   - cron: '0 8 * * 1' # Optional: Wöchentlicher automatischer Lauf (Montags um 8:00 Uhr)

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Notwendig, um die generierten Dateien automatisch zu committen

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Skript ausführen
        run: python scrape.py

      - name: Änderungen committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/aktuelles/
          git diff --staged --quiet || git commit -m "chore: Schach-News automatisch aktualisiert [skip ci]"
          git push
          
