name: Import Articles from Old Website

on:
  workflow_dispatch: # Lässt sich manuell per Knopfdruck in GitHub starten

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Scraper Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Scraper Script
        run: |
          python3 - << 'EOF'
          import os
          import re
          import requests
          from bs4 import BeautifulSoup

          URL = "https://www.tsfwelzheim.de/abteilungen/schach/aktuelles/"
          OUTPUT_DIR = "docs/aktuelles"
          os.makedirs(OUTPUT_DIR, exist_ok=True)

          print(f"Lade Seite: {URL} ...")
          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
          response = requests.get(URL, headers=headers)
          
          if response.status_code != 200:
              print(f"Fehler: Statuscode {response.status_code}")
              exit(1)

          soup = BeautifulSoup(response.text, "html.parser")

          # Hier suchen wir nach typischen Artikel-Containern der alten Seite
          articles = soup.find_all(['article', 'div'], class_=re.compile("news|post|entry|content|item", re.I))
          
          if not articles:
              # Fallback: Falls keine spezifischen Container gefunden werden, nehmen wir Artikel-Blöcke oder Überschriften
              articles = soup.find_all('h2')

          print(f"{len(articles)} potenzielle Beiträge gefunden.")

          for i, art in enumerate(articles):
              # Versuche, eine Überschrift zu finden
              title_tag = art.find(['h1', 'h2', 'h3'])
              if not title_tag and art.name in ['h2', 'h3']:
                  title_tag = art
              
              if not title_tag:
                  continue

              title = title_tag.get_text(strip=True)
              if not title or len(title) < 3:
                  continue

              # Dateinamen generieren
              safe_title = re.sub(r'[^\w\s-]', '', title).strip().lower()
              safe_title = re.sub(r'[-\s]+', '-', safe_title)[:40]
              
              # Platzhalter-Datum (kann danach im Git oder per Skript angepasst werden)
              filename = f"2026-05-1{i+1}-{safe_title}.md"
              file_path = os.path.join(OUTPUT_DIR, filename)

              # Wenn die Datei schon existiert, überspringen wir sie, um manuelle Änderungen nicht zu überschreiben
              if os.path.exists(file_path):
                  print(f"Überspringe (existiert bereits): {filename}")
                  continue

              # Textinhalte sammeln (entweder aus dem Parent-Container oder dem Element selbst)
              container = art.find_parent(['article', 'div']) or art
              paragraphs = container.find_all(['p', 'ul', 'li'])
              
              content_lines = [f"# {title}\n"]
              for p in paragraphs:
                  text = p.get_text(strip=True)
                  # Verhindere, dass die Überschrift doppelt reinkommt
                  if text and text != title:
                      content_lines.append(text + "\n")

              with open(file_path, "w", encoding="utf-8") as f:
                  f.write("\n".join(content_lines))

              print(f"Erfolgreich erstellt: {filename}")

          EOF

      - name: Commit and push new articles
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/aktuelles/
          git diff --staged --quiet || git commit -m "Automatischer Import alter Artikel von tsfwelzheim.de"
          git push
          
